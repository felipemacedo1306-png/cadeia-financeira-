<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Negócio — Agência Web & Recorrência (2 Sócios)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131a2a;
      --surface-light: #1b2438;
      --border: #27334d;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HERO */
    header {
      background: radial-gradient(circle at top right, #1e293b 0%, var(--bg) 65%);
      border-bottom: 1px solid var(--border);
      padding: 64px 0 56px;
      text-align: center;
    }

    .pill {
      display: inline-block;
      background: var(--primary-glow);
      border: 1px solid var(--primary);
      color: #93c5fd;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 16px;
    }

    header h1 span {
      background: linear-gradient(90deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      max-width: 660px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.08rem;
    }
